name: Android standalone build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK
        run: |
          # runner 预装 SDK；setup-android 会请求已下线的 tools 包而失败，
          # 同时它的 PATH 注入也一并消失，这里显式定位 cmdline-tools。
          sdkmanager_bin="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          test -n "$sdkmanager_bin"
          export PATH="$sdkmanager_bin:$PATH"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35" || yes | sdkmanager "platforms;android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" || yes | sdkmanager "build-tools;35.0.0"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Guard reviewed Android contracts
        run: |
          git fetch --no-tags https://github.com/lemon-casino/LemonCode.git main:refs/remotes/android-upstream/main
          node scripts/android/check-parity.mjs
      - name: Upstream type, lint and architecture gates
        run: |
          node --test scripts/android/*.test.mjs
          pnpm typecheck
          pnpm lint
          pnpm architecture:check --changed
      - name: Mobile client contract tests
        run: node --test packages/web/test/pairingCredentialStore.test.mjs packages/web/test/pairingFrames.test.mjs packages/web/test/mirrorReconnect.test.mjs
      - name: Set build version
        run: |
          node -e 'const fs=require("node:fs");const p=require("./package.json");const code=Math.floor(Date.now()/1000)-1704067200;fs.appendFileSync(process.env.GITHUB_ENV,`ANDROID_VERSION_NAME=${p.version}-android\nANDROID_VERSION_CODE=${code}\n`);'
      - name: Build standalone runtime inputs
        run: node scripts/android/build-standalone.mjs
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Android unit tests, lint and APK
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify packaged runtime
        run: node scripts/android/verify-apk.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: LemonCode-Android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/reports/lint-results-debug.html
            .android-tools/runtime-verification.json
