name: Android release

# 0.1 起使用固定 keystore 生成可覆盖升级的正式包，并创建 GitHub Release。
# 密钥只来自仓库 Secrets；缺少任何一项时 fail closed，不用临时密钥签名。
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "版本名，例如 0.1.0"
        required: true
        default: "0.1.0"
      version_code:
        description: "递增的 versionCode"
        required: true
        default: "1"
      publish_release:
        description: "同时创建 GitHub Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      # 创建 Release 需要写权限；签名密钥仍只来自 Secrets，不因该权限暴露。
      contents: write
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK
        run: |
          sdkmanager_bin="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          test -n "$sdkmanager_bin"
          export PATH="$sdkmanager_bin:$PATH"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35" || yes | sdkmanager "platforms;android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" || yes | sdkmanager "build-tools;35.0.0"
      - name: Resolve version
        id: v
        env:
          INPUT_NAME: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#android-v}"
            code="${name//./}"
          else
            name="${INPUT_NAME}"
            code="${INPUT_CODE}"
          fi
          test -n "$name" && test -n "$code"
          printf 'name=%s\ncode=%s\n' "$name" "$code" >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Guard reviewed Android contracts
        run: |
          git fetch --no-tags https://github.com/lemon-casino/LemonCode.git main:refs/remotes/android-upstream/main
          node scripts/android/check-parity.mjs
      - name: Build standalone runtime inputs
        env:
          ANDROID_VERSION_NAME: ${{ steps.v.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.v.outputs.code }}
        run: node scripts/android/build-standalone.mjs
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Android tests and release APK
        working-directory: apps/android
        env:
          ANDROID_VERSION_NAME: ${{ steps.v.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.v.outputs.code }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify signed APK
        run: |
          apk="$(ls apps/android/app/build/outputs/apk/release/*.apk | head -1)"
          test -n "$apk"
          apksigner_bin="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          test -x "$apksigner_bin"
          "$apksigner_bin" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          ! grep -qi "CN=Android Debug" "$RUNNER_TEMP/certs.txt"
          cp "$apk" "LemonCode-android-${{ steps.v.outputs.name }}-arm64.apk"
          sha256sum "LemonCode-android-${{ steps.v.outputs.name }}-arm64.apk" > "LemonCode-android-${{ steps.v.outputs.name }}-arm64.apk.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: LemonCode-android-${{ steps.v.outputs.name }}
          if-no-files-found: error
          retention-days: 90
          path: |
            LemonCode-android-*.apk
            LemonCode-android-*.apk.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ steps.v.outputs.name }}"
          gh release create "$tag" \
            "LemonCode-android-${{ steps.v.outputs.name }}-arm64.apk" \
            "LemonCode-android-${{ steps.v.outputs.name }}-arm64.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LemonCode Android ${{ steps.v.outputs.name }}" \
            --notes "独立运行版：APK 内置 Node 运行时、本地服务端、Agent 与共享界面，不依赖电脑。仅支持 arm64（Android 8.0+）。文件下载、内嵌浏览器、Computer Use 尚未实现。"
