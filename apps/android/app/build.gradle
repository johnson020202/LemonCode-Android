plugins {
    id 'com.android.application'
}

String codeText = providers.environmentVariable('ANDROID_VERSION_CODE').getOrElse('1')
if (!(codeText ==~ /[1-9][0-9]{0,9}/) || codeText.toLong() > 2100000000L) {
    throw new GradleException('ANDROID_VERSION_CODE must be an integer from 1 to 2100000000')
}
String nameText = providers.environmentVariable('ANDROID_VERSION_NAME').getOrElse('0.1.0')
if (nameText.trim().isEmpty() || nameText.length() > 100 || nameText.toCharArray().any { Character.isISOControl(it) }) {
    throw new GradleException('ANDROID_VERSION_NAME must be a nonempty printable version (max 100 characters)')
}

def signingEnv = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
        .collectEntries { key -> [(key): providers.environmentVariable(key).orNull] }
boolean signingComplete = signingEnv.values().every { it != null && !it.trim().isEmpty() }
def releaseKeystore = signingComplete ? file(signingEnv.ANDROID_KEYSTORE_PATH) : null
boolean signingReady = signingComplete && releaseKeystore.isFile() && releaseKeystore.canRead()

android {
    namespace 'vin.lemon.android'
    compileSdk 35

    defaultConfig {
        applicationId 'vin.lemon.android'
        minSdk 26
        targetSdk 35
        versionCode codeText.toInteger()
        versionName nameText
    }

    buildFeatures {
        buildConfig true
    }
    // 运行时以 lib*.so 随 APK 分发；Android 只允许从 nativeLibraryDir 执行随包二进制。
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile releaseKeystore
                storePassword signingEnv.ANDROID_KEYSTORE_PASSWORD
                keyAlias signingEnv.ANDROID_KEY_ALIAS
                keyPassword signingEnv.ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            resValue 'string', 'app_name', 'LemonCode Android (debug)'
        }
        release {
            resValue 'string', 'app_name', 'LemonCode'
            debuggable false
            minifyEnabled false
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Every release path (including direct package/bundle task invocation) fails closed.
// Debug and local unit tests do not require a keystore or generated frontend.
def verifyReleaseInputs = tasks.register('verifyReleaseInputs') {
    doLast {
        if (!signingReady) {
            throw new GradleException('Release disabled: provide all four ANDROID_KEYSTORE_* / ANDROID_KEY_* signing variables and a readable existing keystore. No signing key is generated.')
        }
        for (String required : ['src/main/assets/runtime/runtime-manifest.json',
                                'src/main/assets/runtime/runtime-payload.tar',
                                'src/main/assets/www/index.html',
                                'src/main/assets/android-build.json']) {
            if (!file(required).isFile()) {
                throw new GradleException("Release disabled: missing ${required}; run the Android packaging scripts first.")
            }
        }
    }
}
tasks.configureEach { task ->
    if (task.name != 'verifyReleaseInputs' && task.name.toLowerCase(Locale.ROOT).contains('release')) {
        task.dependsOn(verifyReleaseInputs)
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    // FileProvider：Android 7+ 不允许用 file:// 启动安装器。
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
