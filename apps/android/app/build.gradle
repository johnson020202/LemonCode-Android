plugins {
    id 'com.android.application'
}

String codeText = providers.environmentVariable('ANDROID_VERSION_CODE').getOrElse('1')
if (!(codeText ==~ /[1-9][0-9]{0,9}/) || codeText.toLong() > 2100000000L) {
    throw new GradleException('ANDROID_VERSION_CODE must be an integer from 1 to 2100000000')
}
String nameText = providers.environmentVariable('ANDROID_VERSION_NAME').getOrElse('0.1.0')
if (nameText.trim().isEmpty() || nameText.length() > 100 || nameText.toCharArray().any { Character.isISOControl(it) }) {
    throw new GradleException('ANDROID_VERSION_NAME must be a nonempty printable version (max 100 characters)')
}

// 共存构建：默认使用独立 applicationId（vin.lemon.android.plus），
// 与原版 vin.lemon.android 同时安装、同时运行时拥有独立数据目录、回环端口、Provider 与深链。
// 亦可通过 ANDROID_APPLICATION_ID / -PapplicationId 显式覆盖回原版包名或自定义包名。
String appIdText = (project.findProperty('applicationId')
        ?: providers.environmentVariable('ANDROID_APPLICATION_ID').orNull
        ?: 'vin.lemon.android.plus').toString().trim()
if (!(appIdText ==~ /[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+/)) {
    throw new GradleException("Invalid ANDROID_APPLICATION_ID: ${appIdText}")
}
boolean isOriginalPackage = (appIdText == 'vin.lemon.android')
int defaultServerPort = isOriginalPackage ? 31234
        : ('vin.lemon.android.plus' == appIdText ? 31235 : 32000 + Math.abs(appIdText.hashCode() % 7000))
String portText = providers.environmentVariable('ANDROID_SERVER_PORT')
        .getOrElse(String.valueOf(defaultServerPort)).trim()
if (!(portText ==~ /[1-9][0-9]{3,4}/) || portText.toInteger() < 1024 || portText.toInteger() > 65535) {
    throw new GradleException("ANDROID_SERVER_PORT must be a TCP port from 1024 to 65535")
}
String oauthSchemeText = providers.environmentVariable('ANDROID_OAUTH_SCHEME')
        .getOrElse(isOriginalPackage ? 'lcode' : 'lcodeplus').trim().toLowerCase(Locale.ROOT)
if (!(oauthSchemeText ==~ /[a-z][a-z0-9+.-]{1,31}/)) {
    throw new GradleException("Invalid ANDROID_OAUTH_SCHEME: ${oauthSchemeText}")
}
String updateAssetSuffix = providers.environmentVariable('ANDROID_UPDATE_ASSET_SUFFIX')
        .getOrElse(isOriginalPackage ? '-arm64.apk' : '-plus-arm64.apk').trim()
String launcherLabel = isOriginalPackage ? 'LemonCode' : 'LemonCode Plus'
String debugLauncherLabel = isOriginalPackage ? 'LemonCode Android (debug)' : 'LemonCode Plus (debug)'
String homeTitleText = isOriginalPackage ? 'LemonCode Android' : 'LemonCode Plus'

def signingEnv = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
        .collectEntries { key -> [(key): providers.environmentVariable(key).orNull] }
boolean signingComplete = signingEnv.values().every { it != null && !it.trim().isEmpty() }
def releaseKeystore = signingComplete ? file(signingEnv.ANDROID_KEYSTORE_PATH) : null
boolean signingReady = signingComplete && releaseKeystore.isFile() && releaseKeystore.canRead()

android {
    namespace 'vin.lemon.android'
    compileSdk 35

    defaultConfig {
        applicationId appIdText
        minSdk 26
        targetSdk 35
        versionCode codeText.toInteger()
        versionName nameText
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [oauthScheme: oauthSchemeText]
        buildConfigField 'int', 'PREFERRED_SERVER_PORT', portText
        buildConfigField 'String', 'OAUTH_SCHEME', "\"${oauthSchemeText}\""
        buildConfigField 'String', 'UPDATE_ASSET_SUFFIX', "\"${updateAssetSuffix}\""
        resValue 'string', 'preview_title', homeTitleText
    }

    buildFeatures {
        buildConfig true
    }
    // 运行时以 lib*.so 随 APK 分发；Android 只允许从 nativeLibraryDir 执行随包二进制。
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile releaseKeystore
                storePassword signingEnv.ANDROID_KEYSTORE_PASSWORD
                keyAlias signingEnv.ANDROID_KEY_ALIAS
                keyPassword signingEnv.ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            resValue 'string', 'app_name', debugLauncherLabel
        }
        release {
            resValue 'string', 'app_name', launcherLabel
            debuggable false
            minifyEnabled false
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Every release path (including direct package/bundle task invocation) fails closed.
// Debug and local unit tests do not require a keystore or generated frontend.
def verifyReleaseInputs = tasks.register('verifyReleaseInputs') {
    doLast {
        if (!signingReady) {
            throw new GradleException('Release disabled: provide all four ANDROID_KEYSTORE_* / ANDROID_KEY_* signing variables and a readable existing keystore. No signing key is generated.')
        }
        for (String required : ['src/main/assets/runtime/runtime-manifest.json',
                                'src/main/assets/runtime/runtime-payload.tar',
                                'src/main/assets/www/index.html',
                                'src/main/assets/android-build.json']) {
            if (!file(required).isFile()) {
                throw new GradleException("Release disabled: missing ${required}; run the Android packaging scripts first.")
            }
        }
    }
}
tasks.configureEach { task ->
    if (task.name != 'verifyReleaseInputs' && task.name.toLowerCase(Locale.ROOT).contains('release')) {
        task.dependsOn(verifyReleaseInputs)
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    // FileProvider：Android 7+ 不允许用 file:// 启动安装器。
    implementation 'androidx.core:core:1.13.1'
    // 扫码：CameraX 取景 + ML Kit 离线二维码识别（模型随 APK 分发，不依赖 GMS）。
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    testImplementation 'junit:junit:4.13.2'
    // 本地单元测试运行在 JVM 上，android.jar 的 org.json 只是抛 not-mocked 的桩。
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
